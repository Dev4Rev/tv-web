server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/vnd.apple.mpegurl m3u8;
        audio/x-mpegurl            m3u;
    }

    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/vnd.apple.mpegurl audio/x-mpegurl;

    # Неизвестные адреса отдаём нашей страницей 404. Её клиентский guard
    # затем переводит браузер на канонический /404.html?from=...
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Красивые адреса: файлы остаются .html, но доступны без расширения.
    location = /privacy { try_files /privacy.html =404; }
    location = /404     { try_files /404.html     =404; }
    location = /index   { try_files /index.html   =404; }

    # Старые .html-адреса тоже работают (для обратной совместимости).
}
